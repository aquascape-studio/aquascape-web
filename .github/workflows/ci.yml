name: ci
on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: web

      - uses: actions/checkout@v4
        with:
          repository: aquascape-studio/aquascape-botany
          path: botany

      - uses: actions/checkout@v4
        with:
          repository: aquascape-studio/aquascape-ui
          path: ui

      - uses: actions/checkout@v4
        with:
          repository: aquascape-studio/aquascape-render
          path: render

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build @aquascape-studio/botany
        working-directory: botany/js
        run: pnpm install --no-frozen-lockfile && pnpm build

      - name: Build @aquascape-studio/ui
        working-directory: ui
        run: pnpm install --no-frozen-lockfile && pnpm build

      - name: Build @aquascape-studio/render
        working-directory: render
        run: pnpm install --no-frozen-lockfile && pnpm build

      - name: Wire local packages into web
        working-directory: web
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.dependencies['@aquascape-studio/botany'] = 'file:../botany/js';
            pkg.dependencies['@aquascape-studio/ui'] = 'file:../ui';
            pkg.dependencies['@aquascape-studio/render'] = 'file:../render';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          pnpm install --no-frozen-lockfile

      - run: pnpm typecheck
        working-directory: web

      - run: pnpm build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: web

      - uses: actions/checkout@v4
        with:
          repository: aquascape-studio/aquascape-botany
          path: botany

      - uses: actions/checkout@v4
        with:
          repository: aquascape-studio/aquascape-ui
          path: ui

      - uses: actions/checkout@v4
        with:
          repository: aquascape-studio/aquascape-render
          path: render

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build @aquascape-studio/botany
        working-directory: botany/js
        run: pnpm install --no-frozen-lockfile && pnpm build

      - name: Build @aquascape-studio/ui
        working-directory: ui
        run: pnpm install --no-frozen-lockfile && pnpm build

      - name: Build @aquascape-studio/render
        working-directory: render
        run: pnpm install --no-frozen-lockfile && pnpm build

      - name: Wire local packages into web
        working-directory: web
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.dependencies['@aquascape-studio/botany'] = 'file:../botany/js';
            pkg.dependencies['@aquascape-studio/ui'] = 'file:../ui';
            pkg.dependencies['@aquascape-studio/render'] = 'file:../render';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          pnpm install --no-frozen-lockfile

      - name: Build Next.js app
        working-directory: web
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Xiaopu approved the v3 time-lapse visuals on 2026-11-12 → flag on in prod
          NEXT_PUBLIC_FF_GROWTH_TIMELAPSE: "1"
          # Xiaopu waived visual sign-off on 2026-11-12 ("no need to wait for my approval") → stylized tank on
          NEXT_PUBLIC_FF_STYLIZED_TANK: "1"

      - name: Prune dev dependencies
        working-directory: web
        run: pnpm prune --prod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_DEV }}
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE_URI=063418083301.dkr.ecr.us-east-1.amazonaws.com/aquascape-web-dev
          docker build -f web/Dockerfile.ci -t "$IMAGE_URI:${{ github.sha }}" -t "$IMAGE_URI:latest" web/
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"

      - name: Update ECS task definition and deploy
        run: |
          IMAGE_URI=063418083301.dkr.ecr.us-east-1.amazonaws.com/aquascape-web-dev
          NEW_TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition aquascape-web-dev \
              --region us-east-1 \
              --query 'taskDefinition' --output json | \
            jq --arg IMG "$IMAGE_URI:${{ github.sha }}" '
              del(.taskDefinitionArn,.revision,.status,.requiresAttributes,
                  .placementConstraints,.compatibilities,.registeredAt,.registeredBy) |
              .containerDefinitions[0].image = $IMG |
              del(.containerDefinitions[0].command) |
              (.containerDefinitions[0].environment[] | select(.name == "NODE_ENV")).value = "production"
            ')
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --region us-east-1 \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster aquascape-dev \
            --service aquascape-web-dev \
            --task-definition "$NEW_ARN" \
            --force-new-deployment \
            --region us-east-1

      - name: Verify deployment (ECS stable + HTTP smoke)
        # dev scales to 0 outside its daily window (infra#1); then there is nothing to probe.
        run: |
          DESIRED=$(aws ecs describe-services --cluster aquascape-dev --services aquascape-web-dev \
            --region us-east-1 --query 'services[0].desiredCount' --output text)
          echo "desiredCount=$DESIRED"
          if [ "$DESIRED" = "0" ]; then
            echo "::notice::dev is scaled to 0 (outside its daily window); skipping HTTP smoke"
            exit 0
          fi
          aws ecs wait services-stable --cluster aquascape-dev --services aquascape-web-dev --region us-east-1
          RUNNING_IMG=$(aws ecs describe-task-definition --region us-east-1 --task-definition \
            "$(aws ecs describe-services --cluster aquascape-dev --services aquascape-web-dev --region us-east-1 \
               --query 'services[0].taskDefinition' --output text)" \
            --query 'taskDefinition.containerDefinitions[0].image' --output text)
          echo "running image: $RUNNING_IMG"
          case "$RUNNING_IMG" in *"${{ github.sha }}") ;; *) echo "::error::service is not running this commit"; exit 1;; esac
          # CloudFront → task origin is re-pointed by a Lambda on task start; allow a few minutes
          for path in / /studio/sim /plants; do
            ok=0
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://dev.efferves.live$path" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              echo "$path → $code (attempt $i)"; sleep 15
            done
            [ "$ok" = "1" ] || { echo "::error::$path did not return 200"; exit 1; }
            echo "$path → 200"
          done
